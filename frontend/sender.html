<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Clipboard Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #66d6a9;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      font-size: 1.5rem;
      margin: 0;
      color: #ffffff;
    }

    .code-display {
      margin: 20px 0;
      background: #ffffff;
      padding: 10px;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .input-area {
      margin: 20px 0;
      text-align: left;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border-radius: 4px;
      border: none;
      font-size: 1rem;
      resize: none;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      background-color: #fff;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #ddd;
    }

    footer p {
      color: #004f40;
      font-size: 0.9rem;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Send Clipboard Data</h1>
    </header>
    <div class="code-display">
      <span id="clipboard-code">VDFJ2L</span>
    </div>
    <div class="input-area">
      <textarea id="clipboard-content" placeholder="Paste or type your data here..."></textarea>
    </div>
    <div class="buttons">
      <button id="send-button">Send</button>
      <button id="qr-button">QR</button>
      <button id="refresh-button">⟳</button>
      <button id="delete-button">🗑️</button>
    </div>
    <footer>
      <p id="instruction">You can share your data easily!</p>
    </footer>
  </div>
  <script src="sender.js"></script>
</body>
</html>
